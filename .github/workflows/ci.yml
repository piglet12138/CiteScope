name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd backend
          pip install -e . tldextract
      - name: Syntax check (compile all)
        run: |
          cd backend
          python -m compileall -q app/ scripts/
      - name: Import smoke
        env:
          GEO_LOG_LEVEL: WARNING
        run: |
          cd backend
          python -c "from app.main import app; assert app.title.startswith('CiteScope')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
