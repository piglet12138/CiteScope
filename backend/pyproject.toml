[project]
name = "citescope-backend"
version = "0.1.0"
description = "CiteScope backend — AI citation analysis + GEO monitoring"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "wasmtime>=20.0.0",
    "tldextract>=5.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.setuptools.package-data]
"app.services.ai_monitors" = ["*.wasm"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
real = [
    # Filled in when switching from mock to real
    "openai>=1.20.0",
    "anthropic>=0.25.0",
    "playwright>=1.43.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
